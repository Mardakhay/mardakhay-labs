name: Prepare dependency audit fixes

on:
  push:
    branches:
      - fix/dependency-audit-patches
    paths:
      - '.github/workflows/dependency-fix-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-audit-patches
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes
        shell: bash
        run: |
          npm audit fix --no-fund || echo "npm audit fix reported unresolved findings; continuing to validate the resulting dependency tree."

      - name: Ensure manifest ranges were not changed
        run: |
          if ! git diff --quiet -- package.json; then
            echo "Refusing to auto-commit package.json range changes. Review this manifest diff manually."
            git diff -- package.json
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Re-run npm audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-after.json
          audit_status=$?
          set -e
          echo "npm audit exit code after patch updates: ${audit_status}"
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'))
          console.log(JSON.stringify(report.metadata?.vulnerabilities, null, 2))
          NODE

      - name: Commit validated lockfile and remove temporary workflow
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes were produced."
            exit 1
          fi
          git rm .github/workflows/dependency-fix-preview.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): update vulnerable npm packages"
          git push origin HEAD:fix/dependency-audit-patches
