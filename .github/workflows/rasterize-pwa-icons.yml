name: Rasterize PWA Icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build clean PNG icons
        shell: bash
        run: |
          cat > /tmp/pwa-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" fill="#09090b"/>
            <path d="M19 47V17h7.7l5.9 13 5.9-13H46v30h-7.4V29.7L35 38.5h-6.2l-3.6-8.8V47H19Z" fill="#a855f7"/>
          </svg>
          SVG

          rsvg-convert -w 192 -h 192 /tmp/pwa-icon.svg -o public/icon-192.png
          rsvg-convert -w 512 -h 512 /tmp/pwa-icon.svg -o public/icon-512.png

      - name: Commit corrected icons
        shell: bash
        run: |
          if git diff --quiet -- public/icon-192.png public/icon-512.png; then
            echo "PWA icons are already correct."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png
          git commit -m "Fix rasterized PWA icons"
          git push
